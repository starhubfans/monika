<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  background:#050505;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overflow-x:hidden;
}

body{
  background:
    radial-gradient(circle at top,#ff00d414,transparent 35%),
    radial-gradient(circle at bottom,#7b00ff12,transparent 40%),
    #050505;
}

.page{
  width:100%;
  max-width:480px;
  margin:auto;
  min-height:100vh;
  padding-bottom:50px;
}

.header{
  padding:18px;
}

.logo{
  font-size:24px;
  font-weight:800;
  letter-spacing:1px;
}

.logo span{
  color:#ff2f6d;
}

/* NATIVE AD */
.video-native-ad{
  margin:14px 12px 0;
  padding:10px;
  border-radius:12px;
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.06);
  overflow:hidden;
}

.ads-label{
  text-align:center;
  color:#666;
  font-size:8px;
  letter-spacing:1.5px;
  margin-bottom:7px;
}

.video-card{
  margin:0 12px;
  border-radius:18px;
  overflow:hidden;
  background:#090909;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 0 30px rgba(255,0,200,.12);
}

.photo-box{
  position:relative;
  width:100%;
  background:#000;
  overflow:hidden;
}

#videoPoster{
  width:100%;
  display:block;
  max-height:75vh;
  object-fit:cover;
  background:#000;
}

/* LOADING */
.photo-loading{
  position:absolute;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle,rgba(35,0,45,.96),#000 72%);
  transition:opacity .3s ease,visibility .3s ease;
}

.photo-loading.hide{
  opacity:0;
  visibility:hidden;
}

.loading-logo{
  width:54px;
  height:54px;
  border:4px solid rgba(255,255,255,.16);
  border-top-color:#ff00c8;
  border-right-color:#8c00ff;
  border-radius:50%;
  animation:loadingSpin .8s linear infinite;
  box-shadow:0 0 22px rgba(255,0,210,.45);
}

.loading-text{
  position:absolute;
  margin-top:85px;
  font-size:10px;
  font-weight:900;
  letter-spacing:2px;
  color:#fff;
  text-shadow:0 0 10px #ff00d4;
}

@keyframes loadingSpin{
  to{
    transform:rotate(360deg);
  }
}

/* CONTENT */
.content{
  padding:16px;
}

.title{
  font-size:18px;
  font-weight:800;
  line-height:1.3;
  margin-bottom:12px;
}

.description{
  color:#aaa;
  font-size:13px;
  line-height:1.5;
  margin-bottom:16px;
}

/* BUTTON */
.smartlink-btn{
  display:block;
  width:100%;
  padding:15px 18px;
  border-radius:12px;
  text-align:center;
  text-decoration:none;
  color:#fff;
  font-size:15px;
  font-weight:900;
  letter-spacing:.5px;
  background:linear-gradient(135deg,#ff006a,#9b00ff);
  box-shadow:0 8px 25px rgba(255,0,130,.25);
  transition:transform .15s ease,opacity .15s ease;
}

.smartlink-btn:active{
  transform:scale(.97);
  opacity:.9;
}

/* TRENDING */
.trending{
  margin:18px 12px 0;
  padding:16px;
  border-radius:16px;
  background:#0a0a0a;
  border:1px solid rgba(255,255,255,.06);
}

.trending-title{
  font-size:13px;
  font-weight:800;
  color:#ff2f6d;
  margin-bottom:8px;
}

.trending-text{
  font-size:13px;
  color:#ccc;
  line-height:1.5;
}

/* FOOTER */
.footer{
  padding:25px 15px;
  text-align:center;
  color:#555;
  font-size:10px;
}
</style>
</head>

<script>
(function(){

  const poster = document.getElementById("videoPoster");
  const loading = document.getElementById("photoLoading");

  if(!poster) return;

  /* Sembunyikan foto saat loading */
  poster.style.visibility = "hidden";

  /* Tampilkan foto setelah 1 detik */
  setTimeout(function(){

    poster.style.visibility = "visible";

    if(loading){

      loading.classList.add("hide");

      setTimeout(function(){
        loading.remove();
      },300);

    }

  },1000);


  /* Disable klik kanan pada foto */
  poster.addEventListener("contextmenu",function(e){
    e.preventDefault();
  });

})();
</script>
